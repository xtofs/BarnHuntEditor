<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barn Hunt Editor</title>
</head>

<body>
  <div id="app">
    <aside class="layout-panel no-print">
      <h1>Course Layout</h1>
      <p>
        Bales and other items can be edited with the keyboard or the mouse.
      </p>
      <ul>
        <li>Drag items to move</li>
        <li><kbd>↓</kbd> <kbd>↑</kbd> <kbd>←</kbd> <kbd>→</kbd> move selected item</li>
        <li><kbd>r</kbd> rotate</li>
        <li><kbd>a</kbd> anchor toggle</li>
        <li><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> set level</li>
        <li><kbd>␡</kbd> <kbd>⌫</kbd> remove selected item</li>
      </ul>
    </aside>
    <section class="canvas-panel">
      <canvas id="ring" tabindex="0"></canvas>
    </section>
    <section class="footer no-print">
      <!-- <iframe src="https://github.com/sponsors/xtofs/button" title="Sponsor xtofs"        height="32" width="114"></iframe> -->
      <a class="sponsor" href="https://github.com/sponsors/xtofs" rel="noopener" target="_blank">sponsor the developer
        of this page</a>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
