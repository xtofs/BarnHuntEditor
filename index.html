<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barn Hunt Editor</title>
</head>

<body>
  <div id="app">
    <section class="button-bar no-print" role="toolbar" aria-label="Editor actions">
      <div class="button-bar-actions">
        <button id="open-help" class="pill-btn" type="button">Keyboard help</button>
        <button id="open-palette-dialog" class="pill-btn" type="button">Edit color palette</button>
      </div>
      <a class="pill-btn button-link" href="https://github.com/sponsors/xtofs" rel="noopener"
        target="_blank">Sponsor</a>
    </section>

    <section class="canvas-panel">
      <canvas id="ring" tabindex="0"></canvas>
    </section>
  </div>

  <dialog id="palette-dialog-placeholder" class="no-print"></dialog>

  <dialog id="keyboard-help-dialog" class="help-dialog no-print">
    <h2>Keyboard shortcuts</h2>
    <p>Use the mouse and keyboard to edit.</p>
    <ul>
      <li>Drag items to move</li>
      <li><kbd>↓</kbd> <kbd>↑</kbd> <kbd>←</kbd> <kbd>→</kbd> move</li>
      <li><kbd>r</kbd> rotate</li>
      <li><kbd>a</kbd> anchor toggle</li>
      <li><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> set level</li>
      <li><kbd>␡</kbd> <kbd>⌫</kbd> remove selected</li>
    </ul>
    <form method="dialog">
      <button type="submit" class="pill-btn" value="close">Close</button>
    </form>
  </dialog>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
